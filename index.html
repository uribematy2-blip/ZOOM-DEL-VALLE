<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom del Valle | Plataforma de Videoanálisis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ocultar barra de scroll para efecto "Netflix" pero permitir deslizar */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased pb-12">
    
    <header class="bg-gray-800 p-6 shadow-md border-b border-green-500 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-wider">ZOOM DEL VALLE</h1>
                <p class="text-green-400 font-semibold text-sm mt-1">PLATAFORMA DE TRANSMISIONES</p>
            </div>
            <!-- Filtro por Club -->
            <div class="flex items-center gap-3">
                <label class="text-sm text-gray-400">Filtrar:</label>
                <select id="filtro-club" class="bg-gray-900 text-white border border-gray-600 rounded-lg px-4 py-2 outline-none focus:border-green-400" onchange="filtrarVideos()">
                    <option value="todos">Todas las categorías</option>
                    <option value="Los Perales">Los Perales</option>
                    <option value="Neuquen">Selección Neuquén</option>
                    <option value="Seleccionado">Otros Seleccionados</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-10 px-6 space-y-12" id="contenedor-principal">
        <p id="cargando-msj" class="text-gray-400 text-xl text-center mt-10 animate-pulse">Cargando catálogo deportivo...</p>
    </main>

    <!-- Modal Pago -->
    <div id="email-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 p-8 rounded-xl border border-gray-600 max-w-md w-full shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl font-bold">&times;</button>
            <h3 class="text-2xl font-bold text-white mb-2">Boletería Virtual</h3>
            <p class="text-sm text-gray-400 mb-6">Ingresá tu correo electrónico. Allí te enviaremos el link privado de YouTube cuando se apruebe el pago.</p>
            
            <input type="email" id="user-email" placeholder="ejemplo@correo.com" class="w-full p-4 rounded bg-gray-900 text-white border border-gray-600 mb-6 focus:outline-none focus:border-green-400" required>
            
            <button id="btn-pagar" class="w-full bg-green-500 hover:bg-green-400 text-gray-900 text-lg font-bold py-3 rounded-lg transition shadow-lg shadow-green-500/20">
                Ir a Mercado Pago
            </button>
        </div>
    </div>

    <script>
        let allVideos = {};
        let selectedVideoId = null;

        async function cargarVideos() {
            try {
                const res = await fetch('/api/videos');
                allVideos = await res.json();
                renderizarFilas();
            } catch (e) {
                document.getElementById('cargando-msj').innerText = "Error al cargar los videos.";
            }
        }

        function renderizarFilas() {
            const main = document.getElementById('contenedor-principal');
            main.innerHTML = '';
            const filtro = document.getElementById('filtro-club').value;
            
            const categorias = [
                { id: 'vivo', titulo: '🔴 Transmisiones en Vivo' },
                { id: 'resumen', titulo: '🎬 Compactos y Resúmenes' },
                { id: 'tactica', titulo: '🧠 Cámara Táctica (Videoanálisis)' }
            ];

            categorias.forEach(cat => {
                const videosCat = Object.values(allVideos).filter(v => 
                    v.categoria === cat.id && (filtro === 'todos' || v.club === filtro)
                );

                if (videosCat.length > 0) {
                    let filaHTML = `
                        <section>
                            <h2 class="text-2xl font-bold text-gray-200 mb-4">${cat.titulo}</h2>
                            <div class="flex gap-6 overflow-x-auto hide-scroll snap-x pb-6">
                    `;
                    
                    videosCat.forEach(video => {
                        filaHTML += `
                            <div class="snap-start shrink-0 w-80 bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-green-500 transition-all duration-300 relative group">
                                <div class="h-44 bg-gray-900 relative overflow-hidden">
                                    <img src="${video.thumbnail}" alt="${video.title}" class="w-full h-full object-cover opacity-70 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500">
                                    <span class="absolute top-3 right-3 bg-black bg-opacity-80 px-3 py-1 rounded text-green-400 font-black tracking-wider text-sm border border-gray-600 shadow">$${video.price}</span>
                                </div>
                                <div class="p-5 flex flex-col justify-between h-40">
                                    <div>
                                        <p class="text-xs text-green-500 font-bold uppercase tracking-wider mb-1">${video.club}</p>
                                        <h3 class="text-base font-bold text-white leading-tight line-clamp-2">${video.title}</h3>
                                    </div>
                                    <button onclick="openModal('${video.id}')" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded transition">
                                        Comprar Acceso
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    filaHTML += `</div></section>`;
                    main.innerHTML += filaHTML;
                }
            });

            if(main.innerHTML === '') {
                main.innerHTML = '<p class="text-gray-400 text-center text-lg mt-10">No hay videos disponibles con este filtro.</p>';
            }
        }

        function filtrarVideos() { renderizarFilas(); }

        function openModal(id) {
            selectedVideoId = id;
            document.getElementById('email-modal').classList.remove('hidden');
            document.getElementById('user-email').focus();
        }

        function closeModal() {
            selectedVideoId = null;
            document.getElementById('email-modal').classList.add('hidden');
        }

        document.getElementById('btn-pagar').addEventListener('click', async () => {
            const email = document.getElementById('user-email').value;
            if (!email || !email.includes('@')) return alert('Ingresá un correo válido.');

            const btn = document.getElementById('btn-pagar');
            btn.innerText = 'Redirigiendo...'; btn.disabled = true;

            try {
                const res = await fetch('/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoId: selectedVideoId, emailComprador: email })
                });
                const data = await res.json();
                if (data.init_point) window.location.href = data.init_point;
            } catch (e) {
                alert('Error al conectar con Mercado Pago.');
                btn.innerText = 'Ir a Mercado Pago'; btn.disabled = false;
            }
        });

        cargarVideos();
    </script>
</body>
</html>
