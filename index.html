<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom del Valle | Transmisiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-filtro.activo { background-color: #16a34a; color: white; border-color: #16a34a; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased pb-24">
    
    <!-- ENCABEZADO -->
    <header class="bg-gray-800 p-6 shadow-md border-b border-green-500 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-wider">ZOOM DEL VALLE</h1>
                <p class="text-green-400 font-semibold text-sm mt-1">PLATAFORMA DE TRANSMISIONES</p>
            </div>
        </div>
    </header>

    <!-- BARRA DE CATEGORÍAS -->
    <nav class="bg-gray-900 border-b border-gray-800 sticky top-[92px] z-30 shadow-lg">
        <div id="nav-categorias" class="max-w-7xl mx-auto flex gap-3 overflow-x-auto hide-scroll py-4 px-6 snap-x">
            <!-- Los botones se generan solos con JavaScript -->
        </div>
    </nav>

    <!-- CONTENEDOR DE VIDEOS -->
    <main class="max-w-7xl mx-auto mt-8 px-6 space-y-10" id="contenedor-principal">
        <p id="cargando-msj" class="text-gray-400 text-xl text-center mt-10 animate-pulse">Cargando catálogo...</p>
    </main>

    <!-- BOTÓN FLOTANTE WHATSAPP (CONSULTAS) -->
    <a href="https://wa.me/5492948410629?text=Hola%20Zoom%20del%20Valle,%20tengo%20una%20consulta:" target="_blank" class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-400 text-gray-900 p-4 rounded-full shadow-[0_0_15px_rgba(34,197,94,0.5)] z-50 transition transform hover:scale-110 flex items-center justify-center group">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.347-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>

    <!-- Modal Pago -->
    <div id="email-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 p-8 rounded-xl border border-gray-600 max-w-md w-full shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl font-bold">&times;</button>
            <h3 class="text-2xl font-bold text-white mb-2" id="modal-titulo">Boletería Virtual</h3>
            <p class="text-sm text-gray-400 mb-6" id="modal-desc">Ingresá tu correo para recibir el link de YouTube al aprobarse el pago.</p>
            <input type="email" id="user-email" placeholder="ejemplo@correo.com" class="w-full p-4 rounded bg-gray-900 text-white border border-gray-600 mb-6 focus:outline-none focus:border-green-400" required>
            <button id="btn-pagar" class="w-full bg-green-500 hover:bg-green-400 text-gray-900 text-lg font-bold py-3 rounded-lg transition shadow-lg">Ir a Mercado Pago</button>
        </div>
    </div>

    <script>
        let allVideos = {};
        let currentCategory = 'TODAS';
        let selectedVideoId = null;

        async function cargarVideos() {
            try {
                const res = await fetch('/api/videos');
                allVideos = await res.json();
                generarMenuCategorias();
                renderizarFilas();
            } catch (e) {
                document.getElementById('cargando-msj').innerText = "Error de conexión.";
            }
        }

        function generarMenuCategorias() {
            const nav = document.getElementById('nav-categorias');
            const categoriasUnicas = [...new Set(Object.values(allVideos).map(v => v.categoria))];
            
            let navHTML = `<button onclick="filtrarCategoria('TODAS')" class="btn-filtro activo snap-start px-5 py-2 border border-gray-600 rounded-full text-sm font-bold transition whitespace-nowrap text-gray-300 hover:border-green-500">TODAS</button>`;
            
            categoriasUnicas.forEach(cat => {
                navHTML += `<button onclick="filtrarCategoria('${cat}')" class="btn-filtro snap-start px-5 py-2 border border-gray-600 rounded-full text-sm font-bold transition whitespace-nowrap text-gray-300 hover:border-green-500">${cat}</button>`;
            });
            
            nav.innerHTML = navHTML;
        }

        function filtrarCategoria(cat) {
            currentCategory = cat;
            
            // Pinta el botón activo
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.classList.add('activo');
                    btn.classList.remove('text-gray-300', 'border-gray-600');
                } else {
                    btn.classList.remove('activo');
                    btn.classList.add('text-gray-300', 'border-gray-600');
                }
            });
            
            renderizarFilas();
        }

        function renderizarFilas() {
            const main = document.getElementById('contenedor-principal');
            main.innerHTML = '';
            
            let categoriasUnicas = [...new Set(Object.values(allVideos).map(v => v.categoria))];
            
            if (currentCategory !== 'TODAS') {
                categoriasUnicas = [currentCategory];
            }

            if(categoriasUnicas.length === 0) {
                main.innerHTML = '<p class="text-gray-400 text-center text-lg mt-10">No hay videos en esta categoría.</p>';
                return;
            }

            categoriasUnicas.forEach(cat => {
                const videosCat = Object.values(allVideos).filter(v => v.categoria === cat);

                let filaHTML = `
                    <section class="animate-fade-in">
                        <h2 class="text-xl md:text-2xl font-black text-gray-100 mb-4 tracking-wide uppercase border-l-4 border-green-500 pl-3">${cat}</h2>
                        <div class="flex gap-4 overflow-x-auto hide-scroll snap-x pb-4">
                `;
                
                videosCat.forEach(video => {
                    // DISEÑO EXCLUSIVO PARA SERVICIOS
                    if (video.categoria === 'SERVICIOS EXCLUSIVOS') {
                        filaHTML += `
                            <div class="snap-start shrink-0 w-72 bg-gradient-to-br from-green-900 to-gray-900 rounded-xl overflow-hidden border-2 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.2)] relative flex flex-col transition transform hover:-translate-y-1">
                                <div class="h-32 relative">
                                    <img src="${video.thumbnail}" class="w-full h-full object-cover opacity-40">
                                    <span class="absolute top-3 right-3 bg-black px-3 py-1 rounded text-green-400 font-black text-sm border border-green-500">$${video.price}</span>
                                </div>
                                <div class="p-5 flex flex-col justify-between flex-grow text-center">
                                    <h3 class="text-lg font-black text-white leading-tight mb-4 uppercase">${video.title}</h3>
                                    
                                    <div class="space-y-1.5 text-xs text-green-300 font-bold mb-5 uppercase tracking-wider">
                                        <p>✅ Recortes de Jugadas</p>
                                        <p>✅ Análisis de Datos</p>
                                        <p>✅ Estadísticas de Partido</p>
                                        <p>✅ Seguimiento Individual</p>
                                    </div>

                                    <button onclick="openModal('${video.id}', 'servicio')" class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-3 rounded-lg shadow-lg transition">
                                        CONTRATAR AHORA
                                    </button>
                                </div>
                            </div>
                        `;
                    } 
                    // DISEÑO OPTIMIZADO PARA PARTIDOS (Más compacto para leer títulos largos)
                    else {
                        filaHTML += `
                            <div class="snap-start shrink-0 w-64 bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-green-500 transition-all duration-300 relative group flex flex-col">
                                <div class="h-36 bg-gray-900 relative">
                                    <img src="${video.thumbnail}" class="w-full h-full object-cover opacity-70 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500">
                                    <span class="absolute top-2 right-2 bg-black bg-opacity-80 px-2 py-1 rounded text-green-400 font-bold tracking-wider text-sm border border-gray-600 shadow">$${video.price}</span>
                                </div>
                                <div class="p-4 flex flex-col justify-between flex-grow">
                                    <div>
                                        <p class="text-[11px] text-blue-400 font-black uppercase tracking-widest mb-1.5">${video.torneo}</p>
                                        <!-- line-clamp-3 permite hasta 3 renglones antes de cortar con puntos suspensivos -->
                                        <h3 class="text-sm font-bold text-gray-100 leading-snug line-clamp-3">${video.title}</h3>
                                    </div>
                                    <button onclick="openModal('${video.id}', 'video')" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md">
                                        Comprar Acceso
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                });

                filaHTML += `</div></section>`;
                main.innerHTML += filaHTML;
            });
        }

        function openModal(id, tipo) {
            selectedVideoId = id;
            
            if (tipo === 'servicio') {
                document.getElementById('modal-titulo').innerText = 'Contratar Servicio';
                document.getElementById('modal-desc').innerText = 'Ingresá tu correo para el recibo y para coordinar la entrega de tu material.';
            } else {
                document.getElementById('modal-titulo').innerText = 'Boletería Virtual';
                document.getElementById('modal-desc').innerText = 'Ingresá tu correo para recibir el link de YouTube al aprobarse el pago.';
            }

            document.getElementById('email-modal').classList.remove('hidden');
            document.getElementById('user-email').focus();
        }

        function closeModal() {
            selectedVideoId = null;
            document.getElementById('email-modal').classList.add('hidden');
        }

        document.getElementById('btn-pagar').addEventListener('click', async () => {
            const email = document.getElementById('user-email').value;
            if (!email || !email.includes('@')) return alert('Ingresá un correo válido.');
            
            const btn = document.getElementById('btn-pagar');
            btn.innerText = 'Redirigiendo...'; 
            btn.disabled = true;
            
            try {
                const res = await fetch('/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoId: selectedVideoId, emailComprador: email })
                });
                const data = await res.json();
                if (data.init_point) window.location.href = data.init_point;
            } catch (e) {
                alert('Error al conectar con Mercado Pago.');
                btn.innerText = 'Ir a Mercado Pago'; 
                btn.disabled = false;
            }
        });

        // CSS extra inyectado para la animación suave al filtrar
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        `;
        document.head.appendChild(style);

        cargarVideos();
    </script>
</body>
</html>
