<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom del Valle | Plataforma de videoanálisis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-filtro.activo { background-color: #16a34a; color: white; border-color: #16a34a; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased pb-24">
    
    <!-- ENCABEZADO INSTITUCIONAL -->
    <header class="bg-gray-800 p-4 md:p-6 shadow-lg border-b border-green-500 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- Izquierda: Título y Subtítulo -->
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-white tracking-wider">ZOOM DEL VALLE</h1>
                <p class="text-green-400 font-bold text-xs md:text-sm tracking-wide">Plataforma de videoanálisis</p>
            </div>
            <!-- Derecha: Tu Logo en Círculo -->
            <div class="flex items-center">
                <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=200&auto=format&fit=crop" alt="Logo Zoom del Valle" class="w-12 h-12 md:w-14 md:h-14 rounded-full border-2 border-green-500 object-cover shadow-[0_0_10px_rgba(34,197,94,0.4)]">
            </div>
        </div>
    </header>

    <!-- BARRA DE BÚSQUEDA Y CATEGORÍAS -->
    <div class="bg-gray-900 border-b border-gray-800 sticky top-[80px] md:top-[92px] z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-3 flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Buscador en Vivo -->
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="buscador-input" oninput="filtrarBusqueda()" placeholder="Buscar equipo, torneo o categoría..." class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:border-green-500 text-sm shadow-inner">
            </div>
            <!-- Botones de Categorías -->
            <nav id="nav-categorias" class="w-full md:w-auto flex gap-2 overflow-x-auto hide-scroll pb-1 md:pb-0 snap-x">
                <!-- Se generan dinámicamente -->
            </nav>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-7xl mx-auto mt-8 px-6 space-y-12" id="contenedor-principal">
        <p id="cargando-msj" class="text-gray-400 text-xl text-center mt-10 animate-pulse">Cargando catálogo...</p>
    </main>

    <!-- MODAL DE VISTA INDIVIDUAL (EN GRANDE) -->
    <div id="detalle-modal" class="fixed inset-0 bg-black bg-opacity-85 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 rounded-2xl border border-gray-700 max-w-xl w-full shadow-2xl relative overflow-hidden flex flex-col">
            <button onclick="closeDetalleModal()" class="absolute top-4 right-4 bg-gray-900 bg-opacity-70 hover:bg-opacity-100 text-gray-300 hover:text-white w-10 h-10 rounded-full flex items-center justify-center text-2xl font-bold z-10 transition">&times;</button>
            <div class="h-56 bg-gray-900 relative">
                <img id="modal-img" src="" class="w-full h-full object-cover">
                <span id="modal-precio" class="absolute bottom-3 right-3 bg-black bg-opacity-90 px-3 py-1.5 rounded-lg text-green-400 font-black text-lg border border-gray-600 shadow-lg"></span>
                <span id="modal-torneo" class="absolute top-3 left-3 bg-blue-600 text-white px-3 py-1 rounded-md text-xs font-black uppercase tracking-wider shadow"></span>
            </div>
            <div class="p-6 flex flex-col justify-between flex-grow">
                <div>
                    <p id="modal-categoria" class="text-xs text-green-400 font-bold uppercase tracking-widest mb-1"></p>
                    <h2 id="modal-titulo" class="text-xl md:text-2xl font-black text-white leading-tight mb-6"></h2>
                </div>
                <div class="flex gap-4">
                    <button onclick="cerrarAbrirPago()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl text-base transition shadow-lg flex items-center justify-center gap-2">
                        💳 COMPRAR ACCESO AHORA
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE PAGO (CORREO) -->
    <div id="email-modal" class="fixed inset-0 bg-black bg-opacity-85 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 max-w-md w-full shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl font-bold">&times;</button>
            <h3 class="text-2xl font-black text-white mb-2" id="modal-pago-titulo">Boletería Virtual</h3>
            <p class="text-sm text-gray-400 mb-6" id="modal-pago-desc">Ingresá tu correo para continuar con el pago seguro en Mercado Pago.</p>
            <input type="email" id="user-email" placeholder="ejemplo@correo.com" class="w-full p-4 rounded-xl bg-gray-900 text-white border border-gray-700 mb-6 focus:outline-none focus:border-green-500 text-base" required>
            <button id="btn-pagar" class="w-full bg-green-500 hover:bg-green-400 text-gray-900 text-lg font-black py-3.5 rounded-xl transition shadow-lg">Ir a Mercado Pago</button>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE WHATSAPP -->
    <a href="https://wa.me/5492948410629?text=Hola%20Zoom%20del%20Valle,%20tengo%20una%20consulta:" target="_blank" class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-400 text-gray-900 p-4 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.6)] z-50 transition transform hover:scale-110 flex items-center justify-center">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.347-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>

    <script>
        let allVideos = {};
        let currentCategory = 'TODAS';
        let selectedVideoId = null;

        async function cargarVideos() {
            try {
                const res = await fetch('/api/videos');
                allVideos = await res.json();
                generarMenuCategorias();
                renderizarContenido();
            } catch (e) {
                document.getElementById('cargando-msj').innerText = "Error de conexión.";
            }
        }

        function generarMenuCategorias() {
            const nav = document.getElementById('nav-categorias');
            const categoriasUnicas = [...new Set(Object.values(allVideos).map(v => v.categoria))];
            
            let navHTML = `<button onclick="filtrarCategoria('TODAS')" class="btn-filtro activo snap-start px-4 py-2 border border-gray-700 rounded-full text-xs font-bold transition whitespace-nowrap text-gray-300 hover:border-green-500">TODAS</button>`;
            
            categoriasUnicas.forEach(cat => {
                navHTML += `<button onclick="filtrarCategoria('${cat}')" class="btn-filtro snap-start px-4 py-2 border border-gray-700 rounded-full text-xs font-bold transition whitespace-nowrap text-gray-300 hover:border-green-500">${cat}</button>`;
            });
            
            nav.innerHTML = navHTML;
        }

        function filtrarCategoria(cat) {
            currentCategory = cat;
            document.getElementById('buscador-input').value = ''; // Limpia búsqueda al cambiar categoría
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.classList.add('activo');
                    btn.classList.remove('text-gray-300', 'border-gray-700');
                } else {
                    btn.classList.remove('activo');
                    btn.classList.add('text-gray-300', 'border-gray-700');
                }
            });
            renderizarContenido();
        }

        function filtrarBusqueda() {
            renderizarContenido();
        }

        function renderizarContenido() {
            const main = document.getElementById('contenedor-principal');
            main.innerHTML = '';
            
            const textoBusqueda = document.getElementById('buscador-input').value.toLowerCase().trim();
            
            // Filtra los videos según la categoría seleccionada y el texto de búsqueda
            let listaVideos = Object.values(allVideos);
            
            if (currentCategory !== 'TODAS') {
                listaVideos = listaVideos.filter(v => v.categoria === currentCategory);
            }

            if (textoBusqueda !== '') {
                listaVideos = listaVideos.filter(v => 
                    v.title.toLowerCase().includes(textoBusqueda) || 
                    v.torneo.toLowerCase().includes(textoBusqueda) || 
                    v.categoria.toLowerCase().includes(textoBusqueda)
                );
            }

            if (listaVideos.length === 0) {
                main.innerHTML = '<p class="text-gray-400 text-center text-lg mt-12">No se encontraron partidos o servicios con ese criterio.</p>';
                return;
            }

            // Agrupa por Categoría y Torneo
            const categoriasUnicas = [...new Set(listaVideos.map(v => v.categoria))];

            categoriasUnicas.forEach(cat => {
                const videosCat = listaVideos.filter(v => v.categoria === cat);

                if (cat === 'SERVICIOS EXCLUSIVOS') {
                    let seccionHTML = `
                        <section class="animate-fade-in">
                            <h2 class="text-xl md:text-2xl font-black text-gray-100 mb-6 tracking-wide uppercase border-l-4 border-green-500 pl-3">${cat}</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    `;
                    
                    videosCat.forEach(video => {
                        seccionHTML += `
                            <div class="bg-gradient-to-br from-green-950 to-gray-900 rounded-2xl overflow-hidden border-2 border-green-500 shadow-xl flex flex-col justify-between p-6">
                                <div>
                                    <div class="flex justify-between items-center mb-4">
                                        <span class="text-xs font-black uppercase text-green-300 bg-green-900 px-3 py-1 rounded-full border border-green-700">${video.torneo}</span>
                                        <span class="text-green-400 font-black text-xl">$${video.price}</span>
                                    </div>
                                    <h3 class="text-xl font-black text-white leading-tight mb-4 uppercase">${video.title}</h3>
                                    <div class="space-y-2 text-sm text-green-200 font-bold mb-6 uppercase tracking-wider">
                                        <p>✅ Recortes de Jugadas</p>
                                        <p>✅ Análisis de Datos</p>
                                        <p>✅ Estadísticas de Partido</p>
                                        <p>✅ Seguimiento Individual</p>
                                    </div>
                                </div>
                                <button onclick="openModal('${video.id}', 'servicio')" class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-3.5 rounded-xl shadow-lg transition">
                                    CONTRATAR AHORA
                                </button>
                            </div>
                        `;
                    });

                    seccionHTML += `
                        <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 hover:border-green-500 flex flex-col justify-between p-6 transition shadow-xl">
                            <div>
                                <span class="text-xs font-black uppercase text-blue-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-600 inline-block mb-4">ATENCIÓN PERSONALIZADA</span>
                                <h3 class="text-xl font-black text-white leading-tight mb-4 uppercase">CONSULTA Y AGENDA TU PARTIDO</h3>
                                <p class="text-sm text-gray-300 mb-6 leading-relaxed">¿Querés transmitir un torneo, coordinar una cobertura exclusiva o agendar una fecha especial? Escribinos directo.</p>
                            </div>
                            <a href="https://wa.me/5492948410629?text=Hola%20Zoom%20del%20Valle,%20quiero%20consultar%20y%20agendar%20una%20transmisión/partido." target="_blank" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-lg transition text-center block">
                                📱 CONSULTAR POR WHATSAPP
                            </a>
                        </div>
                    `;

                    seccionHTML += `</div></section>`;
                    main.innerHTML += seccionHTML;
                } else {
                    const torneosEnCat = [...new Set(videosCat.map(v => v.torneo))];

                    torneosEnCat.forEach(torneo => {
                        const videosTorneo = videosCat.filter(v => v.torneo === torneo);
                        const tituloSeccion = torneosEnCat.length > 1 ? `${cat} — ${torneo}` : cat;

                        let filaHTML = `
                            <section class="animate-fade-in mb-10">
                                <h2 class="text-xl md:text-2xl font-black text-gray-100 mb-6 tracking-wide uppercase border-l-4 border-green-500 pl-3">${tituloSeccion}</h2>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
                        `;
                        
                        videosTorneo.forEach(video => {
                            filaHTML += `
                                <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 hover:border-green-500 transition-all duration-300 relative group flex flex-col shadow-lg cursor-pointer" onclick="openDetalleModal('${video.id}')">
                                    <div class="h-40 bg-gray-900 relative">
                                        <img src="${video.thumbnail}" onerror="this.src='https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=800&auto=format&fit=crop'" class="w-full h-full object-cover opacity-75 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500">
                                        <span class="absolute top-2 right-2 bg-black bg-opacity-90 px-2.5 py-1 rounded-md text-green-400 font-extrabold text-sm border border-gray-600 shadow">$${video.price}</span>
                                    </div>
                                    <div class="p-4 flex flex-col justify-between flex-grow">
                                        <div>
                                            <p class="text-[11px] text-blue-400 font-black uppercase tracking-widest mb-1.5">${video.torneo}</p>
                                            <h3 class="text-sm font-bold text-gray-100 leading-snug line-clamp-3 group-hover:text-green-400 transition">${video.title}</h3>
                                        </div>
                                        <div class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs text-center transition shadow">
                                            Ver Detalle / Comprar
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        filaHTML += `</div></section>`;
                        main.innerHTML += filaHTML;
                    });
                }
            });
        }

        // Modal de Vista Individual en Grande
        function openDetalleModal(id) {
            selectedVideoId = id;
            const video = allVideos[id];
            if (!video) return;

            document.getElementById('modal-img').src = video.thumbnail;
            document.getElementById('modal-precio').innerText = `$${video.price}`;
            document.getElementById('modal-torneo').innerText = video.torneo;
            document.getElementById('modal-categoria').innerText = video.categoria;
            document.getElementById('modal-titulo').innerText = video.title;

            document.getElementById('detalle-modal').classList.remove('hidden');
        }

        function closeDetalleModal() {
            document.getElementById('detalle-modal').classList.add('hidden');
        }

        function cerrarAbrirPago() {
            closeDetalleModal();
            openModal(selectedVideoId, 'video');
        }

        function openModal(id, tipo) {
            selectedVideoId = id;
            if (tipo === 'servicio') {
                document.getElementById('modal-pago-titulo').innerText = 'Contratar Servicio';
                document.getElementById('modal-pago-desc').innerText = 'Ingresá tu correo para coordinar la entrega de tu material.';
            } else {
                document.getElementById('modal-pago-titulo').innerText = 'Boletería Virtual';
                document.getElementById('modal-pago-desc').innerText = 'Ingresá tu correo para continuar con el pago seguro.';
            }
            document.getElementById('email-modal').classList.remove('hidden');
            document.getElementById('user-email').focus();
        }

        function closeModal() {
            selectedVideoId = null;
            document.getElementById('email-modal').classList.add('hidden');
        }

        document.getElementById('btn-pagar').addEventListener('click', async () => {
            const email = document.getElementById('user-email').value;
            if (!email || !email.includes('@')) return alert('Ingresá un correo válido.');
            
            const btn = document.getElementById('btn-pagar');
            btn.innerText = 'Redirigiendo...'; 
            btn.disabled = true;
            
            try {
                const res = await fetch('/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoId: selectedVideoId, emailComprador: email })
                });
                const data = await res.json();
                if (data.init_point) window.location.href = data.init_point;
            } catch (e) {
                alert('Error al conectar con Mercado Pago.');
                btn.innerText = 'Ir a Mercado Pago'; 
                btn.disabled = false;
            }
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        `;
        document.head.appendChild(style);

        cargarVideos();
    </script>
</body>
</html>
